# Local development only. Plaintext Kafka bound to loopback, not for internet exposure.
services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: streamshield-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_LOG_RETENTION_HOURS: "24"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: streamshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamshield
      POSTGRES_PASSWORD: streamshield_dev_only
      POSTGRES_DB: streamshield
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamshield -d streamshield"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Optional Phase 9 dashboard: start with "docker compose --profile dashboard up -d --build".
  # Runs no Spark job and does not consume Kafka messages.
  dashboard:
    profiles: ["dashboard"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      STREAMSHIELD_PG_DSN: "postgresql://streamshield:streamshield_dev_only@postgres:5432/streamshield_utc"
      STREAMSHIELD_KAFKA_HOST: kafka
      STREAMSHIELD_KAFKA_PORT: "19092"
      STREAMSHIELD_KAFKA_BOOTSTRAP: "kafka:19092"
      STREAMSHIELD_PG_HOST: postgres
      STREAMSHIELD_PG_PORT: "5432"
    volumes:
      - ./outputs:/app/outputs:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  kafka_data:
  postgres_data:
