[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamshield-fraud-platform"
version = "0.1.0"
description = "Synthetic streaming fraud platform: generator, explainable signals, replay-safe local baseline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.6,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
dashboard = ["streamlit>=1.37,<2", "pandas>=2.0,<3", "psycopg[binary]>=3.2,<4", "confluent-kafka>=2.6,<3"]

[project.scripts]
streamshield = "streamshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
